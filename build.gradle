plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.17.3' // 固定版本

}


group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url 'https://maven.aliyun.com/repository/public' }

}

intellij {
    // Use IntelliJ IDEA 2024.2 platform for sandbox runIde
    version = '2024.2'
    plugins = []
    updateSinceUntilBuild = false
}

java {
    toolchain {
        // IntelliJ 2024+ requires Java 17 runtime
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.apache.pdfbox:pdfbox:2.0.30'
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
//    implementation 'org.apache.lucene:lucene-core:8.11.3'
//    implementation 'org.apache.lucene:lucene-queryparser:8.11.3'
//    implementation 'org.apache.lucene:lucene-analyzers-common:8.11.3'


    implementation 'org.apache.lucene:lucene-analysis-common:9.10.0'
    implementation 'org.apache.lucene:lucene-core:9.10.0'
    implementation 'org.apache.lucene:lucene-backward-codecs:9.10.0'
    implementation 'org.apache.lucene:lucene-queryparser:9.10.0'


    // ✅ DJL - 全部用 implementation，确保打包到插件
    implementation 'ai.djl:api:0.24.0'
    implementation 'ai.djl:model-zoo:0.24.0'
    implementation 'ai.djl.huggingface:tokenizers:0.24.0'

    implementation 'ai.djl.pytorch:pytorch-engine:0.24.0'
    implementation 'ai.djl.pytorch:pytorch-model-zoo:0.24.0'

    // ✅ 原生库也改成 implementation
    implementation 'ai.djl.pytorch:pytorch-jni:2.0.1-0.24.0'
    implementation 'ai.djl.pytorch:pytorch-native-cpu:2.0.1:win-x86_64'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

    // 日志
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.slf4j:slf4j-simple:2.0.9'
}

// ✅ 重要：配置插件任务，包含所有依赖
prepareSandbox {
    doLast {
        // 复制所有运行时依赖到插件目录
        copy {
            from configurations.runtimeClasspath
            into "${project.buildDir}/idea-sandbox/plugins/${project.name}/lib"
        }
    }
}
test {
    useJUnitPlatform()
}


